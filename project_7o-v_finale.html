<script>
document.documentElement.classList.add("js");
let themeMode="auto";try{themeMode=localStorage.getItem("theme")||"auto"}catch{}
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
const prefersReducedMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const applyTheme=()=>{
  const next=(themeMode==="dark"||(themeMode==="auto"&&darkMQ.matches))?"dark":"light";
  if(document.documentElement.dataset.theme===next)return;
  const swap=()=>{document.documentElement.dataset.theme=next};
  if(document.startViewTransition&&!prefersReducedMotion()){document.startViewTransition(swap)}else{swap()}
};
applyTheme();darkMQ.addEventListener("change",applyTheme);
let sitePerformance="auto";try{sitePerformance=localStorage.getItem("site-performance")||"auto"}catch{}
const shouldUseLite=()=>matchMedia("(prefers-reduced-motion: reduce)").matches||((navigator.deviceMemory||8)<=4)||((navigator.hardwareConcurrency||8)<=4);
const applyPerformance=()=>document.documentElement.dataset.performance=sitePerformance==="auto"?(shouldUseLite()?"lite":"full"):sitePerformance;
applyPerformance();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f6;--ink:#14202b;--tape:#f5c400;--on-tape:#14202b;--now-fg:#f5c400;--steel:#5b6b78;--blue:#2457e6;--line:#d5dbe2;--card:#fff;--rail:#dde3e8;--glass:rgba(238,241,246,.72);--sh:0 1px 2px rgba(20,32,43,.05),0 22px 42px -20px rgba(20,32,43,.24);--sh-sm:0 1px 2px rgba(20,32,43,.06),0 10px 20px -10px rgba(20,32,43,.2);--r:16px;--e:cubic-bezier(.2,.7,.2,1);color-scheme:light}
:root[data-theme=dark]{--paper:#0e1620;--ink:#e8edf1;--now-fg:#14202b;--steel:#9aa9b5;--blue:#7ea2ff;--line:#2b3945;--card:#17212b;--rail:#22303b;--glass:rgba(14,22,32,.72);--sh:0 1px 2px rgba(0,0,0,.5),0 26px 48px -22px rgba(0,0,0,.65);--sh-sm:0 1px 2px rgba(0,0,0,.45),0 12px 22px -12px rgba(0,0,0,.55);color-scheme:dark}
@property --paper{syntax:'<color>';inherits:true;initial-value:#eef1f6}
@property --ink{syntax:'<color>';inherits:true;initial-value:#14202b}
@property --tape{syntax:'<color>';inherits:true;initial-value:#f5c400}
@property --on-tape{syntax:'<color>';inherits:true;initial-value:#14202b}
@property --now-fg{syntax:'<color>';inherits:true;initial-value:#f5c400}
@property --steel{syntax:'<color>';inherits:true;initial-value:#5b6b78}
@property --blue{syntax:'<color>';inherits:true;initial-value:#2457e6}
@property --line{syntax:'<color>';inherits:true;initial-value:#d5dbe2}
@property --card{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --rail{syntax:'<color>';inherits:true;initial-value:#dde3e8}
@property --glass{syntax:'<color>';inherits:true;initial-value:rgba(238,241,246,.72)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:16px/1.6 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow-x:hidden;background:radial-gradient(1100px 620px at 10% -12%,color-mix(in srgb,var(--tape) 18%,transparent),transparent 58%),radial-gradient(900px 520px at 108% 8%,color-mix(in srgb,var(--blue) 13%,transparent),transparent 55%),radial-gradient(900px 560px at 46% 118%,color-mix(in srgb,var(--tape) 11%,transparent),transparent 60%),var(--paper);background-attachment:fixed,fixed,fixed,fixed;background-repeat:no-repeat;transition:background-color .5s ease}
@media(max-width:720px){body{background-attachment:scroll,scroll,scroll,scroll}}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
[dir=rtl] *{letter-spacing:0!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
#pg{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:var(--blue);transform:scaleX(0);transform-origin:0 50%}
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);transition:box-shadow .3s}
header.s{box-shadow:var(--sh)}
header .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.brand{font-weight:700;text-decoration:none;white-space:nowrap;margin-inline-end:auto}
nav{display:flex;gap:4px;font-size:.95rem}
nav a{text-decoration:none;padding:6px 13px;border-radius:99px;transition:background .25s,transform .25s}
nav a:hover{background:var(--tape);color:var(--on-tape);transform:translateY(-1px)}
.ib{font:inherit;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer;transition:transform .2s var(--e),box-shadow .2s var(--e),border-color .2s}
.ib:hover{transform:translateY(-2px);box-shadow:var(--sh-sm);border-color:color-mix(in srgb,var(--tape) 45%,var(--line))}
.lang{position:relative}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:6px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top;transition:.22s var(--e)}
.menu.o{opacity:1;visibility:visible;transform:none}
.menu button{display:block;width:100%;text-align:start;font:inherit;padding:9px 12px;border:0;border-radius:9px;background:none;color:inherit;cursor:pointer;transition:background .15s}
.menu button:hover,.menu button[aria-current=true]{background:var(--tape);color:var(--on-tape)}
.colours{position:relative;flex:0 0 auto}
.colours .ib{gap:0;padding:9px 12px;font-size:1.05rem}
.colours #cc{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.colour-menu{position:absolute;top:calc(100% + 8px);inset-inline-start:0;display:grid;grid-template-columns:repeat(4,28px);gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transition:.22s var(--e);z-index:25}
.colour-menu.o{opacity:1;visibility:visible;transform:none}
.colour-menu button{width:28px;height:28px;padding:0;border:2px solid var(--card);outline:1px solid var(--line);border-radius:50%;background:var(--c);cursor:pointer;transition:transform .15s,outline-color .15s}
.colour-menu button:hover{transform:scale(1.12);outline-color:var(--ink)}
.colour-menu button[aria-current=true]{outline:2px solid var(--ink);outline-offset:2px}
@media(max-width:720px){nav{display:none}}

.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--e),transform .8s var(--e);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

.hero{padding-top:96px;padding-bottom:36px;position:relative;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.32;animation:fl 16s ease-in-out infinite alternate}
.hero::before{width:340px;height:340px;background:var(--tape);top:-30px;inset-inline-start:-70px}
.hero::after{width:300px;height:300px;background:var(--blue);top:70px;inset-inline-end:-50px;animation-delay:-7s}
@keyframes fl{to{transform:translate(50px,34px) scale(1.18)}}

const LOC={el:"el-GR",en:"en-GB",es:"es-ES",he:"he-IL",fa:"fa-IR-u-ca-gregory"},RTL=["he","fa"];
let lang="";try{lang=localStorage.getItem("lang")||""}catch{}
if(!L[lang])lang=(navigator.languages||[]).map(x=>x.slice(0,2)).find(x=>L[x])||"el";
const A=k=>L[lang][k]||L.en[k]||L.el[k];
const t=(k,v={})=>A(k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmt=d=>new Date(d).toLocaleDateString(LOC[lang]);
const fmtL=d=>new Date(d).toLocaleDateString(LOC[lang],{day:"numeric",month:"long",year:"numeric"});

/* ---------- Κουδούνια και μετροταινία ---------- */
const P=[[495,540],[545,590],[600,645],[650,695],[705,745],[750,790],[795,835]];
const T=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
const pos=m=>(m-480)/360*100;
let h='<div class="rail"></div>';
P.forEach(([a,b],i)=>h+=`<div class="seg" style="--i:${i};left:${pos(a)}%;width:${pos(b)-pos(a)}%">${i+1}</div>`);
for(let m=480;m<=840;m+=15){const hr=m%60===0;h+=`<i class="tk${hr?" h":""}" style="left:${pos(m)}%"></i>`;if(hr)h+=`<span class="tl" style="left:${pos(m)}%">${m/60}:00</span>`}
$("#tape").innerHTML=h+'<div class="mk" id="mk" hidden></div>';

function tick(){
  const d=new Date(),day=d.getDay(),m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  $("#clock").textContent=d.toLocaleTimeString(LOC[lang],{hourCycle:"h23"});
  $("#date").textContent=d.toLocaleDateString(LOC[lang],{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const school=day>0&&day<6;let msg,cur=-1;
  if(!school)msg=t("cl");
  else if(m<P[0][0])msg=t("fs",{n:Math.ceil(P[0][0]-m)});
  else if(m>=P[6][1])msg=t("end");
  else{cur=P.findIndex(([a,b])=>m>=a&&m<b);
    if(cur>=0)msg=t("cur",{n:cur+1,e:T(P[cur][1]),r:Math.ceil(P[cur][1]-m)});
    else{const n=P.findIndex(([a])=>a>m);msg=t("brk",{n:n+1,s:T(P[n][0])})}}
  if($("#status").textContent!==msg)$("#status").textContent=msg;
  $$(".seg").forEach((s,i)=>s.classList.toggle("on",i===cur));
  $$("#bells tr").forEach((r,i)=>r.classList.toggle("on",i===cur));
  const mk=$("#mk");mk.hidden=!(school&&m>=480&&m<=840);mk.style.left=pos(m)+"%";
}

let CLASS_PDF=DEFAULT.pdfs.classes,schedSince=DEFAULT.since,warnOn=false,soonD=null,updFn=()=>t("chk");
function setDocs(p){CLASS_PDF=p.classes;[["#d1","classes"],["#d2","rooms"],["#d3","teachers"]].forEach(([s,k])=>{const a=$(s);a.hidden=!p[k];if(p[k]){a.href=p[k];a.removeAttribute("target");a.setAttribute("download",p[k].split("/").pop().split("#")[0])}})}
const r=(p,n)=>Array.from({length:n},(_,i)=>p+(i+1));
const GROUPS=[r("Α",6),r("Β",10),r("ΒΠΛ",2),r("ΒΥΓ",10),r("Γ",10),["ΓΑΙΣΘ 1","ΓΑΙΣΘ2","Γ ΚΟΜ1","ΓΚΟΜ2","ΓΝΟΣ","ΓΦΥΣ1","ΓΦΥΣ2","ΓΦΑΡΜ","ΓΟΔΟΝΤ",...r("ΓΒΡΕΦ",3),"ΓΑΚΤΙΝ","ΓΙΕ","ΓΕΦΑΡ","ΓΔΙΚΤ"]];
let page=0;const CLASSES=[];GROUPS.forEach((list,gi)=>list.forEach(n=>CLASSES.push({gi,n,page:++page})));
let mine="";try{mine=localStorage.getItem("mine")||""}catch{}
const norm=s=>s.toUpperCase().replace(/\s/g,"").replace(/[ABG]/g,c=>({A:"Α",B:"Β",G:"Γ"})[c]);
const url=c=>`${CLASS_PDF}#page=${c.page}`;
function render(filter=""){
  const f=norm(filter);let html="",k=0;
  GROUPS.forEach((_,gi)=>{const items=CLASSES.filter(c=>c.gi===gi&&norm(c.n).includes(f));
    if(items.length)html+=`<div class="grp"><h3>${A("g")[gi]}</h3><div class="chips">`+items.map(c=>`<a class="chip a${c.n===mine?" mine":""}" style="--d:${Math.min(k++,24)*22}ms" href="${url(c)}" target="_blank" rel="noopener" data-c="${c.n}">${c.n}</a>`).join("")+`</div></div>`});
  $("#chips").innerHTML=html||`<p class="lead">${t("none")}</p>`;
}
function showMine(){const c=CLASSES.find(x=>x.n===mine),el=$("#mine");el.hidden=!c;if(c){el.href=url(c);el.textContent=t("mine",{c:c.n})}}
function viewerLabels(){const shown=!$("#viewerFrame").hidden;$("#viewerEmpty").hidden=shown;$("#viewerEmpty").textContent=t("vempty");if(shown){const c=CLASSES.find(x=>x.n===mine);if(c){$("#viewerLabel").textContent=t("view",{c:c.n});$("#viewerOpen").textContent=t("otab")}}}
function showViewer(c){if(!c)return;$("#viewerFrame").src=url(c);$("#viewerFrame").hidden=false;$("#viewerOpen").hidden=false;$("#viewerOpen").href=url(c);viewerLabels()}
function openClassInPage(n){mine=n;try{localStorage.setItem("mine",mine)}catch{}$$(".chip.mine").forEach(x=>x.classList.remove("mine"));$$(`.chip[data-c="${n}"]`).forEach(x=>x.classList.add("mine"));showMine();const c=CLASSES.find(x=>x.n===mine);if(c){showViewer(c);$("#viewer").scrollIntoView({behavior:"smooth",block:"start"})}}
$("#q").addEventListener("input",e=>render(e.target.value));
$("#chips").addEventListener("click",e=>{const a=e.target.closest("a[data-c]");if(!a)return;e.preventDefault();openClassInPage(a.dataset.c)});
$("#mine").addEventListener("click",e=>{e.preventDefault();if(mine)openClassInPage(mine)});

async function checkSchedule(){
  try{
    const q="?search="+encodeURIComponent("Πρόγραμμα")+"&per_page=30&_fields=id,type,title,link,content";
    const res=await Promise.allSettled(["pages","posts"].map(k=>getJSON(API+k+q)));
    if(res.every(x=>x.status==="rejected"))throw 0;
    const today=new Date();today.setHours(0,0,0,0);
    const cands=res.flatMap(x=>x.value||[]).map(i=>{const ti=plain(i.title.rendered);return{ti,id:i.id,type:i.type,date:titleDate(ti),pdfs:pdfsOf(i.content.rendered)}}).filter(c=>c.date&&/πρόγραμμα/i.test(c.ti)).sort((a,b)=>b.date-a.date);
    const now=cands.find(c=>c.date<=today&&c.pdfs.classes),soon=cands.filter(c=>c.date>today).pop();
    if(now){const s={since:now.date.toISOString(),pdfs:now.pdfs};applySchedule(s);try{localStorage.setItem("sched",JSON.stringify(s))}catch{}}
    soonD=soon?{date:soon.date}:null;
    const at=new Date().toLocaleTimeString(LOC[lang],{hour:"2-digit",minute:"2-digit"});
    updFn=()=>t(now?"ok":"nonew",{t:at});
  }catch{updFn=()=>t("fail")}
  renderNotes();
}

const renderNews=()=>{$("#newsList").innerHTML=newsHTML(newsItems);const h=newsItems.map(x=>`<span>◆ ${esc(tt(x.ti))}</span>`).join("");$("#tkr").innerHTML=h+h};
const newsDetails=html=>{
  const d=parseHTML(html);
  d.querySelectorAll("script,style,noscript,iframe,form").forEach(x=>x.remove());
  const files=[],seen=new Set();
  d.querySelectorAll("a[href]").forEach(a=>{
    let u;try{u=new URL(a.getAttribute("href"),BASE)}catch{return}
    if(u.hostname!=="7epal-laris.lar.sch.gr"||u.protocol!=="https:")return;
    const label=plain(a.innerHTML).replace(/\b(λήψη|download)\b/ig,"").replace(/\s{2,}/g," ").trim();
    const isFile=u.pathname.includes("/wp-content/uploads/")||/\b(λήψη|download)\b/i.test(plain(a.innerHTML));
    if(!isFile||seen.has(u.href))return;
    seen.add(u.href);
    const raw=decodeURIComponent(u.pathname.split("/").pop()||"").trim();
    files.push({url:u.href,name:label||raw||"Αρχείο",filename:raw||"download"});
    a.remove();
  });
  return {text:plain(d.body.innerHTML),files};
};

async function downloadNewsFile(a){
  if(a.getAttribute("aria-busy")==="true")return;
  const url=a.dataset.downloadUrl,name=a.dataset.downloadName||"download";
  a.setAttribute("aria-busy","true");
  try{
    const res=await fetch(url,{mode:"cors",credentials:"omit",signal:AbortSignal.timeout(30000)});
    if(!res.ok)throw new Error("download");
    const blob=await res.blob(),objectURL=URL.createObjectURL(blob);
    const tmp=document.createElement("a");
    tmp.href=objectURL;tmp.download=name;tmp.style.display="none";
    document.body.appendChild(tmp);tmp.click();tmp.remove();
    setTimeout(()=>URL.revokeObjectURL(objectURL),1000);
  }catch{
    const tmp=document.createElement("a");
    tmp.href=url;tmp.download=name;tmp.style.display="none";tmp.rel="noopener";
    document.body.appendChild(tmp);tmp.click();tmp.remove();
  }finally{a.removeAttribute("aria-busy")}
}

async function loadNewsItem(i){
  const item=newsItems[i],box=$("#news-body-"+i),btn=document.querySelector(`.news-toggle[data-news-index="${i}"]`);
  if(!item||!box||!btn)return;
  const open=btn.getAttribute("aria-expanded")==="true";
  if(open){btn.setAttribute("aria-expanded","false");box.hidden=true;return}
  $$(".news-toggle").forEach(b=>{if(b!==btn)b.setAttribute("aria-expanded","false")});
  $$(".news-body").forEach(b=>{if(b!==box)b.hidden=true});
  btn.setAttribute("aria-expanded","true");box.hidden=false;box.classList.add("loading");box.textContent=t("ld");
  try{
    let html=item.content;
    if(!html&&item.id){const post=await getJSON(API+"posts/"+encodeURIComponent(item.id)+"?_fields=content");html=post.content?.rendered||"";item.content=html}
    if(!html)throw 0;
    const {text:t0,files}=newsDetails(html);const text=await trOne(t0);
    const fileHTML=files.length?`<div class="news-files">${files.map(f=>`<a class="news-download" href="${esc(f.url)}" data-download-url="${esc(f.url)}" data-download-name="${esc(f.filename)}"><span>${esc(f.name)}</span><span class="nb">${t("dl")}</span></a>`).join("")}</div>`:"";
    box.innerHTML=`${text?`<div class="news-text">${esc(text)}</div>`:""}${fileHTML}<button class="news-close" type="button">${t("bk")}</button>`;
    box.querySelectorAll(".news-download").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();downloadNewsFile(a)}));
    box.querySelector(".news-close").onclick=()=>{btn.setAttribute("aria-expanded","false");box.hidden=true};
    box.classList.remove("loading");
  }catch{box.textContent=t("er");box.classList.remove("loading")}
}
$("#newsList").addEventListener("click",e=>{const b=e.target.closest(".news-toggle");if(b)loadNewsItem(+b.dataset.newsIndex)});

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";document.body.append(c);
  const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight,cs=getComputedStyle(document.documentElement);
  const cols=["--tape","--blue","--ink"].map(v=>cs.getPropertyValue(v).trim()||"#f5c400");
  const ps=Array.from({length:120},()=>({x:W/2,y:H*.3,vx:(Math.random()-.5)*18,vy:Math.random()*-15-3,r:Math.random()*6+3,c:cols[Math.random()*3|0],a:Math.random()*6}));
  let f=0;(function d(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<130)requestAnimationFrame(d);else c.remove()})();
}

let PGO={};try{PGO=JSON.parse(localStorage.getItem("pgo")||"{}")}catch{}
const key=c=>CLASS_PDF+"|"+c.n,pageOf=c=>{c.p0=c.p0||c.page;return PGO[key(c)]||c.p0};
const bar=$(".viewer-bar"),pgs=document.createElement("span");pgs.className="pgs";pgs.hidden=true;

const cls=()=>CLASSES.find(x=>x.n===mine);
const setPg=n=>{const c=cls();if(!c)return;n=Math.max(1,Math.min(200,n|0));PGO[key(c)]=n;try{localStorage.setItem("pgo",JSON.stringify(PGO))}catch{}showViewer(c);showMine()};

 const old=$("#viewerFrame"),f=document.createElement("iframe");f.id="viewerFrame";f.title=old.title;f.src=CLASS_PDF+"#page="+c.page+"&view=FitH";old.replaceWith(f);
 const v=$("#viewer");v.classList.add("ld");f.addEventListener("load",()=>v.classList.remove("ld"));setTimeout(()=>v.classList.remove("ld"),8000);
 const o=$("#viewerOpen");o.hidden=false;o.href=CLASS_PDF+"#page="+c.page;viewerLabels();pgs.hidden=false;$("#pgn").value=c.page};

<script>
/* ===== v10: embedded timetable, finder, next-lesson, calendar export ===== */
(()=>{
const X=(el,en)=>TX(el,en);
const SC=window.SCHED;
let vmode="gm";
const u8=Uint8Array.from(atob(window.PDF_B64),c=>c.charCodeAt(0));

const fixDocs=()=>{const a=$("#d1");a.hidden=false;a.href=LOCAL;a.removeAttribute("target");a.setAttribute("download","ΤΜΗΜΑΤΑ-5-10-2026.pdf")};

fixDocs();renderNotes();
const dayName=d=>new Date(2026,9,5+d).toLocaleDateString(LOC[lang],{weekday:"short"});
const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const cdata=c=>SC[CLASSES.indexOf(c)].days;
function now(){const d=new Date();return{d:d.getDay()-1,m:d.getHours()*60+d.getMinutes()+d.getSeconds()/60}}
/* grid: days=[5][lessons]; expand=true splits multi-period lessons per period */
function grid(days,line,expand){
  let h=`<div class="sxw"><table class="sxt"><thead><tr><th></th>`+P.map(([a,b],i)=>`<th><b>${i+1}</b><small>${T(a)}–${T(b)}</small></th>`).join("")+`</tr></thead><tbody>`;
  days.forEach((day,d)=>{h+=`<tr data-d="${d}"><th class="sxd">${dayName(d)}</th>`;
    for(let p=0;p<7;p++){
      const here=day.filter(l=>expand?(l.p<=p&&p<l.p+l.n):l.p===p);
      if(!expand&&day.some(l=>l.p<p&&p<l.p+l.n))continue;
      const n=expand?1:Math.max(1,...here.map(l=>l.n));
      h+=`<td data-p="${p}" data-n="${n}"${n>1?` colspan="${n}"`:""}>`+here.map(l=>`<div class="ls" style="--h:${hue(l.s)}"><b>${esc(tt(l.s))}</b><small>${esc(line(l))}</small></div>`).join("")+`</td>`}

function nextOf(days){const {d,m}=now();if(d<0||d>4)return{d:0,l:days[0][0]||null,tom:true};
  for(let k=0;k<7;k++){const dd=(d+k)%5,cut=k===0?m:-1;const l=days[dd].find(x=>P[x.p][0]>cut);if(l)return{d:dd,l,tom:k>0}}return null}

 "Επίσκεψη Πολωνών εκπαιδευτικών στο 7ο ΕΠΑΛ Λάρισας στο πλαίσιο ευρωπαϊκού προγράμματος":{body:["Μια σημαντική συνάντηση με άξονα την ευρωπαϊκή εκπαιδευτική συνεργασία πραγματοποιήθηκε σήμερα, Τρίτη 15 Σεπτεμβρίου 2026, στο 7ο ΕΠΑΛ Λάρισας. Το σχολείο υποδέχθηκε ομάδα εκπαιδευτικών από την Τεχνική – Επαγγελματική Σχολή της Πολωνίας “Centrum Edukacji i Pracy Młodzieży OHP w Krośnie”, η οποία πραγματοποιεί επίσκεψη στη χώρα μας στο πλαίσιο του ευρωπαϊκού προγράμματος FERS (Fundusze Europejskie dla Rozwoju Społecznego).","Κατά τη διάρκεια της επίσκεψης, οι Πολωνοί και οι Έλληνες εκπαιδευτικοί συμμετείχαν σε μια ευρεία και γόνιμη συνάντηση. Στο επίκεντρο της συζήτησης βρέθηκαν τα εκπαιδευτικά συστήματα των δύο χωρών, με τους συμμετέχοντες να ανταλλάσσουν πολύτιμες απόψεις, εμπειρίες και καλές πρακτικές, εστιάζοντας κυρίως στα πλεονεκτήματα του κάθε συστήματος.","Στη συνέχεια, ακολούθησε αναλυτική ξενάγηση στους σύγχρονους εργαστηριακούς χώρους του 3ου ΕΚ Λάρισας. Οι φιλοξενούμενοι εκπαιδευτικοί είχαν την ευκαιρία να διαπιστώσουν από κοντά τον άρτιο και εξειδικευμένο εξοπλισμό των ειδικοτήτων του Τομέα Υγείας, Πρόνοιας & Ευεξίας και του τομέα Πληροφορικής, ενώ αναπτύχθηκε μια ζωντανή και δημιουργική αλληλεπίδραση μεταξύ των στελεχών των δύο οργανισμών. Την ξενάγηση στους χώρους εκπαίδευσης πραγματοποίησαν η Υποδιευθύντρια του σχολείου, κα Διάλλα Χρυσούλα, και η εκπαιδευτικός της Ειδικότητας Ιατρικών Εργαστηρίων, κα Κωστοπούλου Ανθή.","Με το βλέμμα στραμμένο στο μέλλον, το 7ο ΕΠΑΛ Λάρισας φιλοδοξεί να ανταποδώσει την επίσκεψη στην Πολωνία μέσω ενός αντίστοιχου ευρωπαϊκού προγράμματος. Το σχολείο παραμένει σταθερά ανοιχτό σε κάθε διεθνή συνεργασία που διευρύνει τους ορίζοντες, τις γνώσεις και τις εμπειρίες των μαθητών του, πάντα εντός του προβλεπόμενου θεσμικού πλαισίου."]},
 "Αγιασμός 7ου ΕΠΑΛ, Παρασκευή 11-09-2026":{body:["O ΑΓΙΑΣΜΟΣ για την νέα σχολική χρονιά θα γίνει την Παρασκευή 11-09-2026 στις 9:00 πμ. Θα ακολουθήσει η κατανομή των μαθητών στα τμήματα και η ενημέρωση για το πρόγραμμα."]},
 "Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026":{body:["Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026"],files:["Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026.pdf"]},
 "«Στολίδι» για τη Λάρισα το 7ο ΕΠΑΛ: ολοκληρώνεται η ριζική ανακαίνιση μέσω του προγράμματος «Μαριέττα Γιαννάκου»":{body:["Το σχολείο μας, μετά την ολοκλήρωση των εκτεταμένων εργασιών συντήρησης και ανακαίνισης που πραγματοποιήθηκαν στο πλαίσιο του επισκευαστικού προγράμματος «Μαριέττα Γιαννάκου» του Υπουργείου Παιδείας, Θρησκευμάτων και Αθλητισμού, αποτελεί αναμφίβολα ένα «στολίδι» για την πόλη της Λάρισας. Ως ένα από τα μεγαλύτερα σχολεία Δευτεροβάθμιας Επαγγελματικής Εκπαίδευσης στη Θεσσαλία, το 7ο ΕΠΑΛ προσφέρει ποιοτικές ευκαιρίες εκπαίδευσης στους μαθητές του."]}
};
const esc2=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const DIGITAL_I18N={el:{title:"Ψηφιακές τάξεις",lead:"Βρες τον/την εκπαιδευτικό σου και άνοιξε την ψηφιακή τάξη. Ο κατάλογος προέρχεται από το αρχείο «Ψηφιακές-τάξεις-2026-2027».",how:"Πώς λειτουργεί;",search:"Αναζήτησε ονοματεπώνυμο εκπαιδευτικού…",empty:"Δεν βρέθηκε εκπαιδευτικός με αυτό το όνομα.",count:"τάξεις",modal:"Ψηφιακή τάξη",open:"Άνοιγμα ψηφιακής τάξης ↗",note:"Θα ανοίξει ο επίσημος σύνδεσμος Webex σε νέα καρτέλα.",steps:"Διάλεξε τον/την εκπαιδευτικό σου από τον κατάλογο. Η σελίδα εμφανίζει πρώτα το όνομα και ζητά επιβεβαίωση πριν ανοίξει τον επίσημο σύνδεσμο Webex."},en:{title:"Digital classes",lead:"Find your teacher and open the digital classroom. The directory comes from the supplied Digital Classes 2026–2027 file.",how:"How it works",search:"Search by teacher name…",empty:"No teacher was found with this name.",count:"classes",modal:"Digital class",open:"Open digital class ↗",note:"The official Webex link will open in a new tab.",steps:"Choose your teacher from the directory. The site shows the name first and asks for confirmation before opening the official Webex link."},es:{title:"Aulas digitales",lead:"Busca a tu profesor o profesora y abre el aula digital.",how:"Cómo funciona",search:"Buscar por nombre del profesor…",empty:"No se encontró ningún profesor con este nombre.",count:"aulas",modal:"Aula digital",open:"Abrir aula digital ↗",note:"El enlace oficial de Webex se abrirá en una pestaña nueva.",steps:"Elige a tu profesor en la lista y confirma antes de abrir el enlace oficial de Webex."},he:{title:"כיתות דיגיטליות",lead:"מצאו את המורה ופתחו את הכיתה הדיגיטלית.",how:"איך זה עובד",search:"חיפוש לפי שם המורה…",empty:"לא נמצא מורה בשם זה.",count:"כיתות",modal:"כיתה דיגיטלית",open:"פתיחת כיתה דיגיטלית ↗",note:"קישור ה‑Webex הרשמי ייפתח בכרטיסייה חדשה.",steps:"בחרו את המורה מהרשימה ואשרו לפני פתיחת קישור ה‑Webex הרשמי."},fa:{title:"کلاس‌های دیجیتال",lead:"معلم خود را پیدا کنید و کلاس دیجیتال را باز کنید.",how:"نحوهٔ کار",search:"جستجو بر اساس نام معلم…",empty:"معلمی با این نام پیدا نشد.",count:"کلاس",modal:"کلاس دیجیتال",open:"باز کردن کلاس دیجیتال ↗",note:"پیوند رسمی Webex در زبانهٔ جدید باز می‌شود.",steps:"معلم را از فهرست انتخاب کنید و پیش از باز شدن پیوند رسمی Webex تأیید کنید."}};
const digitalWords=()=>DIGITAL_I18N[typeof lang==="string"&&lang?lang:"el"]||DIGITAL_I18N.en;
function addDigitalClasses(){const host=document.createElement("section");host.className="wrap";host.id="digital";host.innerHTML=`<div class="feature-head"><div><h2 data-digital-text="title"></h2><p class="lead" data-digital-text="lead"></p></div><button class="read-toggle" id="digitalHow" type="button" data-digital-text="how"></button></div><div class="digital-shell"><div class="digital-top"><input id="digitalSearch" type="search"><span class="count-pill" id="digitalCount"></span></div><div class="digital-list" id="digitalList"></div><p class="digital-empty" id="digitalEmpty" data-digital-text="empty" hidden></p></div>`;document.querySelector("#news").before(host);const list=host.querySelector("#digitalList"),input=host.querySelector("#digitalSearch"),count=host.querySelector("#digitalCount"),empty=host.querySelector("#digitalEmpty");const draw=()=>{const term=input.value.trim().toLocaleLowerCase("el");const items=DIGITAL_CLASSES.filter(x=>x.name.toLocaleLowerCase("el").includes(term));count.textContent=`${items.length} / ${DIGITAL_CLASSES.length} ${digitalWords().count}`;empty.hidden=!!items.length;list.innerHTML=items.map(x=>`<button class="digital-class" type="button" data-digital="${DIGITAL_CLASSES.indexOf(x)}"><span>⌁</span>${esc2(x.name)}</button>`).join("")};host._digitalDraw=draw;input.addEventListener("input",draw);list.addEventListener("click",e=>{const b=e.target.closest("[data-digital]");if(!b)return;const item=DIGITAL_CLASSES[+b.dataset.digital];showDigital(item)});host.querySelector("#digitalHow").onclick=()=>{const d=digitalWords();showInfo(d.title,d.steps)};draw()}
function showModal(inner){const layer=document.createElement("div");layer.className="modal-backdrop";layer.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">${inner}</div>`;layer.addEventListener("click",e=>{if(e.target===layer)layer.remove()});document.body.append(layer);layer.querySelector(".close")?.focus();return layer}
function showDigital(item){const d=digitalWords(),validUrl=/^https:\/\//i.test(item.url);const action=validUrl?`<p>${esc2(d.note)}</p><div class="modal-actions"><a class="ib" target="_blank" rel="noopener" href="${esc2(item.url)}">${esc2(d.open)}</a></div>`:`<div class="notice-strip">Η καταχώριση στο αρχικό αρχείο δεν περιέχει πλήρη διεύθυνση URL. Διεύθυνση όπως δόθηκε: <strong>${esc2(item.url)}</strong></div>`;const layer=showModal(`<button class="ib close" type="button">✕ Κλείσιμο</button><h2>${esc2(d.modal)}</h2><p class="lead">${esc2(item.name)}</p>${action}`);layer.querySelector(".close").onclick=()=>layer.remove()}
function showInfo(title,text){const l=showModal(`<button class="ib close" type="button">✕ Κλείσιμο</button><h2>${esc2(title)}</h2><p class="lead">${esc2(text)}</p>`);l.querySelector(".close").onclick=()=>l.remove()}
const newsKey=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[«»“”]/g,"").replace(/[–—-]/g," ").replace(/\s+/g," ").trim().toLocaleLowerCase("el");
function upgradeNews(){const search=document.createElement("input");search.type="search";search.className="announcement-search";search.placeholder="Αναζήτηση στις ανακοινώσεις…";search.setAttribute("aria-label","Αναζήτηση στις ανακοινώσεις");const empty=document.createElement("p");empty.className="announcement-empty";empty.hidden=true;empty.textContent="Καμία ανακοίνωση δεν ταιριάζει με την αναζήτησή σου.";document.querySelector("#news .lead").after(search);search.after(empty);search.addEventListener("input",()=>{const q=search.value.toLocaleLowerCase("el");let visible=0;document.querySelectorAll("#newsList li").forEach(li=>{const hide=!li.innerText.toLocaleLowerCase("el").includes(q);li.classList.toggle("search-hidden",hide);if(!hide)visible++});empty.hidden=!q||visible>0});document.querySelector("#newsList").addEventListener("click",e=>{const b=e.target.closest(".news-toggle");if(!b)return;const title=b.textContent.trim();const source=Object.entries(OFFICIAL_NEWS).find(([key])=>newsKey(key)===newsKey(title))?.[1];if(!source)return; e.stopImmediatePropagation();renderOfficialAnnouncement(b,source)},true)}
function renderOfficialAnnouncement(button,source){const row=button.closest("li"),box=row.querySelector(".news-body"),open=button.getAttribute("aria-expanded")==="true";document.querySelectorAll("#newsList .news-body").forEach(x=>x.hidden=true);document.querySelectorAll("#newsList .news-toggle").forEach(x=>x.setAttribute("aria-expanded","false"));if(open)return;button.setAttribute("aria-expanded","true");box.hidden=false;const attachment=(source.files||[]).map(name=>`<div class="official-attachment">📎 ${esc2(name)}<br><small>Όνομα συνημμένου όπως εμφανίζεται στο επίσημο άρθρο.</small></div>`).join("");box.className="news-body announce-reader";box.innerHTML=`<div class="news-text">${source.body.map(x=>`<p>${esc2(x)}</p>`).join("")}</div>${attachment}<small class="official-source">Πηγή: επίσημος ιστότοπος 7ου ΕΠΑΛ Λάρισας · περιεχόμενο ενσωματωμένο σε αυτή τη σελίδα.</small><div class="modal-actions"><button type="button" class="read-toggle reader-btn" aria-pressed="false">Λειτουργία ανάγνωσης</button><button type="button" class="read-toggle close-news">Κλείσιμο</button></div>`;box.querySelector(".close-news").onclick=()=>{box.hidden=true;button.setAttribute("aria-expanded","false")};box.querySelector(".reader-btn").onclick=e=>{const pressed=e.currentTarget.getAttribute("aria-pressed")==="true";e.currentTarget.setAttribute("aria-pressed",String(!pressed));box.classList.toggle("reader-mode",!pressed)}}
function addStudentTools(){const sec=document.createElement("section");sec.className="wrap";sec.id="student-tools";sec.innerHTML=`<div class="feature-head"><div><h2>Εργαλεία μαθητή</h2><p class="lead">Μικρές χρήσιμες λειτουργίες για την παρουσίαση και την καθημερινότητα στο σχολείο.</p></div></div><div class="tool-grid"><article class="tool-card"><h3>Οι σημειώσεις μου</h3><p class="note">Αποθηκεύονται μόνο σε αυτή τη συσκευή.</p><textarea id="studentNotes" placeholder="Γράψε μια υπενθύμιση, εργασία ή σημείωση…"></textarea><div class="tool-actions"><button class="ib" id="saveNotes" type="button">Αποθήκευση</button><span id="notesSaved" class="saved" aria-live="polite"></span></div></article><article class="tool-card"><h3>Λειτουργία παρουσίασης</h3><p>Μεγαλώνει την αρχική ενότητα, μειώνει τους περισπασμούς και είναι ιδανική για προβολέα.</p><button class="ib" id="presentMode" type="button">Έναρξη παρουσίασης</button><p class="note" style="margin-top:12px">Συντόμευση: πατήστε <kbd>P</kbd>.</p></article></div>`;document.querySelector("#epikoinonia").before(sec);const ta=sec.querySelector("#studentNotes"),saved=sec.querySelector("#notesSaved");try{ta.value=localStorage.getItem("student-notes")||""}catch{}sec.querySelector("#saveNotes").onclick=()=>{try{localStorage.setItem("student-notes",ta.value);saved.textContent="Αποθηκεύτηκε ✓"}catch{saved.textContent="Δεν ήταν δυνατή η αποθήκευση"}};const toggle=()=>{document.body.classList.toggle("presentation-mode");sec.querySelector("#presentMode").textContent=document.body.classList.contains("presentation-mode")?"Έξοδος από παρουσίαση":"Έναρξη παρουσίασης";window.scrollTo({top:0,behavior:"smooth"})};sec.querySelector("#presentMode").onclick=toggle;addEventListener("keydown",e=>{if(e.key.toLowerCase()==="p"&&!/input|textarea/i.test(e.target.tagName))toggle()})}
function addQuickDigitalLink(){const a=document.createElement("a");a.className="qc";a.href="#digital";a.innerHTML="<b aria-hidden=\"true\">⌁</b><span data-digital-text=\"title\"></span>";document.querySelector(".quick").append(a);const nav=document.querySelector("nav");if(nav){const n=document.createElement("a");n.href="#digital";n.dataset.digitalText="title";nav.append(n)}}
function updateDigitalI18n(){const d=digitalWords();document.querySelectorAll("[data-digital-text]").forEach(el=>{el.textContent=d[el.dataset.digitalText]||d.title});const input=document.querySelector("#digitalSearch");if(input){input.placeholder=d.search;input.setAttribute("aria-label",d.search)}document.querySelector("#digital")?._digitalDraw?.();const themeButton=document.querySelector("#tb");if(themeButton){themeButton.classList.add("ib");themeButton.setAttribute("aria-label",typeof themeMode==="string"?`Theme: ${themeMode}`:"Theme")}}
addQuickDigitalLink();addDigitalClasses();addStudentTools();upgradeNews();const inheritedI18n=window.applyI18n;window.applyI18n=function(){inheritedI18n();updateDigitalI18n()};updateDigitalI18n();
</script>

<script id="v11-enhancements">
(()=>{"use strict";

const currentSection=()=>$$v("main section.wrap").find(x=>x.classList.contains("v11-current"))||$$v("main section.wrap").find(x=>x.id)||document.querySelector("main");
const setCurrent=()=>{const top=innerHeight*.42;let win=null,min=Infinity;$$v("main section.wrap[id]").forEach(s=>{const d=Math.abs(s.getBoundingClientRect().top-top);if(d<min){min=d;win=s}});$$v("main section.wrap[id]").forEach(s=>s.classList.toggle("v11-current",s===win));return win};

if(action==="reset"){settings={font:1,leading:1.6,density:"normal",surface:"default",contrast:false,motion:false,focus:false};save();apply();toast("Οι ρυθμίσεις επανήλθαν")}
save();apply()});
const palette=$v("#v11-palette"),search=$v("#v11-search"),results=$v("#v11-results");
const commands=()=>$$v("main section.wrap[id]").map(s=>({label:s.querySelector("h2")?.textContent?.trim()||s.id,target:s.id})).filter(x=>x.label).concat([{label:"Άνοιγμα βοηθού AI",action:()=>typeof aiOpen==="function"&&aiOpen(true)},{label:"Αλλαγή εμφάνισης",action:()=>panelState(true)},{label:"Πίσω στην αρχή",action:()=>scrollTo({top:0,behavior:settings.motion?"auto":"smooth"})}]);

const aiPanel=$v("#aip"),aiInput=$v("#aii"),aiMessages=$v("#aim"),tutorMessages=$v("#tum2");

($v("#aitabs")||aiPanel.firstElementChild).after(kit);
const aiToggle=$v("#v11-ai-toggle"),aiBody=$v("#v11-ai-body");

  try{if(localStorage.getItem("v11-ai-open")==="1"){kit.classList.remove("v11-ai-collapsed");aiBody.hidden=false;aiToggle.setAttribute("aria-expanded","true")}}catch{}

kit.onclick=e=>{const a=e.target.closest("[data-k]")?.dataset.k;if(!a)return;const prompts={bell:"Ποιο είναι το πρόγραμμά μου σήμερα και ποιο μάθημα ακολουθεί;",plan:"Βοήθησέ με να σπάσω αυτή την εργασία σε μικρά βήματα με χρονικό πλάνο:",explain:"Εξήγησέ μου απλά, με ένα σύντομο παράδειγμα:"};if(prompts[a])submitPrompt(prompts[a]);if(a==="clear"){[aiMessages,tutorMessages].filter(Boolean).forEach(x=>x.innerHTML="");toast("Η συνομιλία καθαρίστηκε")}if(a==="save"){const data=[...document.querySelectorAll("#aim .m,#tum2 .m")].map(x=>x.textContent.trim()).filter(Boolean);try{localStorage.setItem("v11-ai-session",JSON.stringify(data.slice(-30)));toast("Αποθηκεύτηκαν "+data.length+" μηνύματα")}catch{}}if(a==="export"){const data=[...document.querySelectorAll("#aim .m,#tum2 .m")].map(x=>x.textContent.trim()).filter(Boolean).join("\n\n");const url=URL.createObjectURL(new Blob([data||"Δεν υπάρχει συνομιλία.",],{type:"text/plain;charset=utf-8"})),link=document.createElement("a");link.href=url;link.download="7epal-ai-session.txt";link.click();setTimeout(()=>URL.revokeObjectURL(url),500)}if(a==="voice"){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){toast("Η φωνητική πληκτρολόγηση δεν υποστηρίζεται από αυτόν τον browser");return}const r=new Recognition();r.lang=document.documentElement.lang==="el"?"el-GR":document.documentElement.lang||"en-US";r.interimResults=true;r.onstart=()=>toast("Ακούω…");r.onresult=x=>{aiInput.value=[...x.results].map(y=>y[0].transcript).join("");if(x.results[x.results.length-1].isFinal)aiInput.focus()};r.onerror=()=>toast("Δεν ακούστηκε καθαρά η φωνή");r.start()}};

const refreshLangCookie=()=>{if((getConsent()||{}).choice==="accepted")setCookie("7epal_lang",language(),180)};
const applyFunctionalCookies=()=>{
 if(!getCookie("7epal_vid")){const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));setCookie("7epal_vid",id,180)}
 const visits=(parseInt(getCookie("7epal_visits")||"0",10)||0)+1;setCookie("7epal_visits",String(visits),180);
 refreshLangCookie();
};
const setConsent=choice=>{
 if(choice==="accepted"){
  try{localStorage.setItem(KEY,JSON.stringify({choice,ts:Date.now()}))}catch{}
  setCookie(CONSENT_COOKIE,choice,180);
  applyFunctionalCookies();
 }else{
  /* rejecting (or closing without a choice) is never remembered — next visit asks again */
  forgetConsent();clearFunctionalCookies();
 }
 try{window.dispatchEvent(new CustomEvent("cookie-consent-change",{detail:{choice}}))}catch{}
};
const localToast=m=>{let t=document.querySelector("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.append(t)}t.textContent=m;t.classList.add("v");clearTimeout(t._cct);t._cct=setTimeout(()=>t.classList.remove("v"),2200)};

let banner=document.getElementById("cookie-consent");
if(!banner){banner=document.createElement("div");banner.id="cookie-consent";banner.setAttribute("role","dialog");banner.setAttribute("aria-live","polite");document.body.append(banner)}

const paint=()=>{
 const w=words[language()]||words.el;
 banner.setAttribute("dir",["he","fa"].includes(language())?"rtl":"auto");
 banner.setAttribute("aria-label",w.title);
 banner.innerHTML=`<div class="cc-inner"><div class="cc-text"><strong>${esc(w.title)}</strong><p>${esc(w.text)}</p></div><div class="cc-actions"><button class="ib cc-reject" type="button">${esc(w.reject)}</button><button class="ib cc-accept" type="button">${esc(w.accept)}</button></div></div>`;
 banner.querySelector(".cc-accept").onclick=()=>choose("accepted",w.savedAccepted);
 banner.querySelector(".cc-reject").onclick=()=>choose("rejected",w.savedRejected);
};

const hide=()=>{banner.classList.add("cc-leaving");const done=()=>{banner.classList.add("cc-hidden");banner.classList.remove("cc-leaving")};if(matchMedia("(prefers-reduced-motion:reduce)").matches)done();else setTimeout(done,340)};
const choose=(choice,msg)=>{setConsent(choice);hide();localToast(msg)};
const show=()=>{banner.classList.remove("cc-hidden","cc-leaving");paint()};

if(getConsent())
{banner.classList.add("cc-hidden");applyFunctionalCookies()}
else{clearFunctionalCookies();show()}

const addFooterLink=()=>{
 const footWrap=document.querySelector("footer .wrap");
 if(!footWrap||footWrap.querySelector(".cc-settings-link"))return null;
 const btn=document.createElement("button");
 btn.type="button";btn.className="cc-settings-link";
 btn.onclick=()=>show();
 footWrap.append(btn);
 return btn;
};
let footerBtn=addFooterLink();
const paintFooter=()=>{if(!footerBtn)footerBtn=addFooterLink();if(footerBtn)footerBtn.textContent=(words[language()]||words.el).settings};
paintFooter();

const prior=window.applyI18n;window.applyI18n=function(){if(typeof prior==="function")prior.apply(this,arguments);if(!banner.classList.contains("cc-hidden"))paint();paintFooter();refreshLangCookie()};
window.cookieConsent={get:getConsent,open:show,getCookie,hasFunctionalCookies:()=>NONESSENTIAL_COOKIES.some(n=>getCookie(n)!==null)};
})();
</script>
</body>
</html>
