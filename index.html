<script>

const applyTheme=()=>{
  const next=(themeMode==="dark"||(themeMode==="auto"&&darkMQ.matches))?"dark":"light";
  if(document.documentElement.dataset.theme===next)return;
  const swap=()=>{document.documentElement.dataset.theme=next};
  if(document.startViewTransition&&!prefersReducedMotion()){document.startViewTransition(swap)}else{swap()}
};

let sitePerformance="auto";try{sitePerformance=localStorage.getItem("site-performance")||"auto"}catch{}
const shouldUseLite=()=>matchMedia("(prefers-reduced-motion: reduce)").matches||((navigator.deviceMemory||8)<=4)||((navigator.hardwareConcurrency||8)<=4);
const applyPerformance=()=>document.documentElement.dataset.performance=sitePerformance==="auto"?(shouldUseLite()?"lite":"full"):sitePerformance;
applyPerformance();
</script>

<style>

async function downloadNewsFile(a){
  if(a.getAttribute("aria-busy")==="true")return;
  const url=a.dataset.downloadUrl,name=a.dataset.downloadName||"download";
  a.setAttribute("aria-busy","true");
  try{
    const res=await fetch(url,{mode:"cors",credentials:"omit",signal:AbortSignal.timeout(30000)});
    if(!res.ok)throw new Error("download");
    const blob=await res.blob(),objectURL=URL.createObjectURL(blob);
    const tmp=document.createElement("a");
    tmp.href=objectURL;tmp.download=name;tmp.style.display="none";
    document.body.appendChild(tmp);tmp.click();tmp.remove();
    setTimeout(()=>URL.revokeObjectURL(objectURL),1000);
  }catch{
    const tmp=document.createElement("a");
    tmp.href=url;tmp.download=name;tmp.style.display="none";tmp.rel="noopener";
    document.body.appendChild(tmp);tmp.click();tmp.remove();
  }finally{a.removeAttribute("aria-busy")}

 "Επίσκεψη Πολωνών εκπαιδευτικών στο 7ο ΕΠΑΛ Λάρισας στο πλαίσιο ευρωπαϊκού προγράμματος":{body:["Μια σημαντική συνάντηση με άξονα την ευρωπαϊκή εκπαιδευτική συνεργασία πραγματοποιήθηκε σήμερα, Τρίτη 15 Σεπτεμβρίου 2026, στο 7ο ΕΠΑΛ Λάρισας. Το σχολείο υποδέχθηκε ομάδα εκπαιδευτικών από την Τεχνική – Επαγγελματική Σχολή της Πολωνίας “Centrum Edukacji i Pracy Młodzieży OHP w Krośnie”, η οποία πραγματοποιεί επίσκεψη στη χώρα μας στο πλαίσιο του ευρωπαϊκού προγράμματος FERS (Fundusze Europejskie dla Rozwoju Społecznego).","Κατά τη διάρκεια της επίσκεψης, οι Πολωνοί και οι Έλληνες εκπαιδευτικοί συμμετείχαν σε μια ευρεία και γόνιμη συνάντηση. Στο επίκεντρο της συζήτησης βρέθηκαν τα εκπαιδευτικά συστήματα των δύο χωρών, με τους συμμετέχοντες να ανταλλάσσουν πολύτιμες απόψεις, εμπειρίες και καλές πρακτικές, εστιάζοντας κυρίως στα πλεονεκτήματα του κάθε συστήματος.","Στη συνέχεια, ακολούθησε αναλυτική ξενάγηση στους σύγχρονους εργαστηριακούς χώρους του 3ου ΕΚ Λάρισας. Οι φιλοξενούμενοι εκπαιδευτικοί είχαν την ευκαιρία να διαπιστώσουν από κοντά τον άρτιο και εξειδικευμένο εξοπλισμό των ειδικοτήτων του Τομέα Υγείας, Πρόνοιας & Ευεξίας και του τομέα Πληροφορικής, ενώ αναπτύχθηκε μια ζωντανή και δημιουργική αλληλεπίδραση μεταξύ των στελεχών των δύο οργανισμών. Την ξενάγηση στους χώρους εκπαίδευσης πραγματοποίησαν η Υποδιευθύντρια του σχολείου, κα Διάλλα Χρυσούλα, και η εκπαιδευτικός της Ειδικότητας Ιατρικών Εργαστηρίων, κα Κωστοπούλου Ανθή.","Με το βλέμμα στραμμένο στο μέλλον, το 7ο ΕΠΑΛ Λάρισας φιλοδοξεί να ανταποδώσει την επίσκεψη στην Πολωνία μέσω ενός αντίστοιχου ευρωπαϊκού προγράμματος. Το σχολείο παραμένει σταθερά ανοιχτό σε κάθε διεθνή συνεργασία που διευρύνει τους ορίζοντες, τις γνώσεις και τις εμπειρίες των μαθητών του, πάντα εντός του προβλεπόμενου θεσμικού πλαισίου."]},
 "Αγιασμός 7ου ΕΠΑΛ, Παρασκευή 11-09-2026":{body:["O ΑΓΙΑΣΜΟΣ για την νέα σχολική χρονιά θα γίνει την Παρασκευή 11-09-2026 στις 9:00 πμ. Θα ακολουθήσει η κατανομή των μαθητών στα τμήματα και η ενημέρωση για το πρόγραμμα."]},
 "Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026":{body:["Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026"],files:["Πρόγραμμα Επαναληπτικών Εξετάσεων Σεπτεμβρίου 2026.pdf"]},
 "«Στολίδι» για τη Λάρισα το 7ο ΕΠΑΛ: ολοκληρώνεται η ριζική ανακαίνιση μέσω του προγράμματος «Μαριέττα Γιαννάκου»":{body:["Το σχολείο μας, μετά την ολοκλήρωση των εκτεταμένων εργασιών συντήρησης και ανακαίνισης που πραγματοποιήθηκαν στο πλαίσιο του επισκευαστικού προγράμματος «Μαριέττα Γιαννάκου» του Υπουργείου Παιδείας, Θρησκευμάτων και Αθλητισμού, αποτελεί αναμφίβολα ένα «στολίδι» για την πόλη της Λάρισας. Ως ένα από τα μεγαλύτερα σχολεία Δευτεροβάθμιας Επαγγελματικής Εκπαίδευσης στη Θεσσαλία, το 7ο ΕΠΑΛ προσφέρει ποιοτικές ευκαιρίες εκπαίδευσης στους μαθητές του."]}
};
const esc2=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const DIGITAL_I18N={el:{title:"Ψηφιακές τάξεις",lead:"Βρες τον/την εκπαιδευτικό σου και άνοιξε την ψηφιακή τάξη. Ο κατάλογος προέρχεται από το αρχείο «Ψηφιακές-τάξεις-2026-2027».",how:"Πώς λειτουργεί;",search:"Αναζήτησε ονοματεπώνυμο εκπαιδευτικού…",empty:"Δεν βρέθηκε εκπαιδευτικός με αυτό το όνομα.",count:"τάξεις",modal:"Ψηφιακή τάξη",open:"Άνοιγμα ψηφιακής τάξης ↗",note:"Θα ανοίξει ο επίσημος σύνδεσμος Webex σε νέα καρτέλα.",steps:"Διάλεξε τον/την εκπαιδευτικό σου από τον κατάλογο. Η σελίδα εμφανίζει πρώτα το όνομα και ζητά επιβεβαίωση πριν ανοίξει τον επίσημο σύνδεσμο Webex."},en:{title:"Digital classes",lead:"Find your teacher and open the digital classroom. The directory comes from the supplied Digital Classes 2026–2027 file.",how:"How it works",search:"Search by teacher name…",empty:"No teacher was found with this name.",count:"classes",modal:"Digital class",open:"Open digital class ↗",note:"The official Webex link will open in a new tab.",steps:"Choose your teacher from the directory. The site shows the name first and asks for confirmation before opening the official Webex link."},es:{title:"Aulas digitales",lead:"Busca a tu profesor o profesora y abre el aula digital.",how:"Cómo funciona",search:"Buscar por nombre del profesor…",empty:"No se encontró ningún profesor con este nombre.",count:"aulas",modal:"Aula digital",open:"Abrir aula digital ↗",note:"El enlace oficial de Webex se abrirá en una pestaña nueva.",steps:"Elige a tu profesor en la lista y confirma antes de abrir el enlace oficial de Webex."},he:{title:"כיתות דיגיטליות",lead:"מצאו את המורה ופתחו את הכיתה הדיגיטלית.",how:"איך זה עובד",search:"חיפוש לפי שם המורה…",empty:"לא נמצא מורה בשם זה.",count:"כיתות",modal:"כיתה דיגיטלית",open:"פתיחת כיתה דיגיטלית ↗",note:"קישור ה‑Webex הרשמי ייפתח בכרטיסייה חדשה.",steps:"בחרו את המורה מהרשימה ואשרו לפני פתיחת קישור ה‑Webex הרשמי."},fa:{title:"کلاس‌های دیجیتال",lead:"معلم خود را پیدا کنید و کلاس دیجیتال را باز کنید.",how:"نحوهٔ کار",search:"جستجو بر اساس نام معلم…",empty:"معلمی با این نام پیدا نشد.",count:"کلاس",modal:"کلاس دیجیتال",open:"باز کردن کلاس دیجیتال ↗",note:"پیوند رسمی Webex در زبانهٔ جدید باز می‌شود.",steps:"معلم را از فهرست انتخاب کنید و پیش از باز شدن پیوند رسمی Webex تأیید کنید."}};
const digitalWords=()=>DIGITAL_I18N[typeof lang==="string"&&lang?lang:"el"]||DIGITAL_I18N.en;
function addDigitalClasses(){const host=document.createElement("section");host.className="wrap";host.id="digital";host.innerHTML=`<div class="feature-head"><div><h2 data-digital-text="title"></h2><p class="lead" data-digital-text="lead"></p></div><button class="read-toggle" id="digitalHow" type="button" data-digital-text="how"></button></div><div class="digital-shell"><div class="digital-top"><input id="digitalSearch" type="search"><span class="count-pill" id="digitalCount"></span></div><div class="digital-list" id="digitalList"></div><p class="digital-empty" id="digitalEmpty" data-digital-text="empty" hidden></p></div>`;document.querySelector("#news").before(host);const list=host.querySelector("#digitalList"),input=host.querySelector("#digitalSearch"),count=host.querySelector("#digitalCount"),empty=host.querySelector("#digitalEmpty");const draw=()=>{const term=input.value.trim().toLocaleLowerCase("el");const items=DIGITAL_CLASSES.filter(x=>x.name.toLocaleLowerCase("el").includes(term));count.textContent=`${items.length} / ${DIGITAL_CLASSES.length} ${digitalWords().count}`;empty.hidden=!!items.length;list.innerHTML=items.map(x=>`<button class="digital-class" type="button" data-digital="${DIGITAL_CLASSES.indexOf(x)}"><span>⌁</span>${esc2(x.name)}</button>`).join("")};host._digitalDraw=draw;input.addEventListener("input",draw);list.addEventListener("click",e=>{const b=e.target.closest("[data-digital]");if(!b)return;const item=DIGITAL_CLASSES[+b.dataset.digital];showDigital(item)});host.querySelector("#digitalHow").onclick=()=>{const d=digitalWords();showInfo(d.title,d.steps)};draw()}
function showModal(inner){const layer=document.createElement("div");layer.className="modal-backdrop";layer.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">${inner}</div>`;layer.addEventListener("click",e=>{if(e.target===layer)layer.remove()});document.body.append(layer);layer.querySelector(".close")?.focus();return layer}
function showDigital(item){const d=digitalWords(),validUrl=/^https:\/\//i.test(item.url);const action=validUrl?`<p>${esc2(d.note)}</p><div class="modal-actions"><a class="ib" target="_blank" rel="noopener" href="${esc2(item.url)}">${esc2(d.open)}</a></div>`:`<div class="notice-strip">Η καταχώριση στο αρχικό αρχείο δεν περιέχει πλήρη διεύθυνση URL. Διεύθυνση όπως δόθηκε: <strong>${esc2(item.url)}</strong></div>`;const layer=showModal(`<button class="ib close" type="button">✕ Κλείσιμο</button><h2>${esc2(d.modal)}</h2><p class="lead">${esc2(item.name)}</p>${action}`);layer.querySelector(".close").onclick=()=>layer.remove()}
function showInfo(title,text){const l=showModal(`<button class="ib close" type="button">✕ Κλείσιμο</button><h2>${esc2(title)}</h2><p class="lead">${esc2(text)}</p>`);l.querySelector(".close").onclick=()=>l.remove()}
const newsKey=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[«»“”]/g,"").replace(/[–—-]/g," ").replace(/\s+/g," ").trim().toLocaleLowerCase("el");
function upgradeNews(){const search=document.createElement("input");search.type="search";search.className="announcement-search";search.placeholder="Αναζήτηση στις ανακοινώσεις…";search.setAttribute("aria-label","Αναζήτηση στις ανακοινώσεις");const empty=document.createElement("p");empty.className="announcement-empty";empty.hidden=true;empty.textContent="Καμία ανακοίνωση δεν ταιριάζει με την αναζήτησή σου.";document.querySelector("#news .lead").after(search);search.after(empty);search.addEventListener("input",()=>{const q=search.value.toLocaleLowerCase("el");let visible=0;document.querySelectorAll("#newsList li").forEach(li=>{const hide=!li.innerText.toLocaleLowerCase("el").includes(q);li.classList.toggle("search-hidden",hide);if(!hide)visible++});empty.hidden=!q||visible>0});document.querySelector("#newsList").addEventListener("click",e=>{const b=e.target.closest(".news-toggle");if(!b)return;const title=b.textContent.trim();const source=Object.entries(OFFICIAL_NEWS).find(([key])=>newsKey(key)===newsKey(title))?.[1];if(!source)return; e.stopImmediatePropagation();renderOfficialAnnouncement(b,source)},true)}
function renderOfficialAnnouncement(button,source){const row=button.closest("li"),box=row.querySelector(".news-body"),open=button.getAttribute("aria-expanded")==="true";document.querySelectorAll("#newsList .news-body").forEach(x=>x.hidden=true);document.querySelectorAll("#newsList .news-toggle").forEach(x=>x.setAttribute("aria-expanded","false"));if(open)return;button.setAttribute("aria-expanded","true");box.hidden=false;const attachment=(source.files||[]).map(name=>`<div class="official-attachment">📎 ${esc2(name)}<br><small>Όνομα συνημμένου όπως εμφανίζεται στο επίσημο άρθρο.</small></div>`).join("");box.className="news-body announce-reader";box.innerHTML=`<div class="news-text">${source.body.map(x=>`<p>${esc2(x)}</p>`).join("")}</div>${attachment}<small class="official-source">Πηγή: επίσημος ιστότοπος 7ου ΕΠΑΛ Λάρισας · περιεχόμενο ενσωματωμένο σε αυτή τη σελίδα.</small><div class="modal-actions"><button type="button" class="read-toggle reader-btn" aria-pressed="false">Λειτουργία ανάγνωσης</button><button type="button" class="read-toggle close-news">Κλείσιμο</button></div>`;box.querySelector(".close-news").onclick=()=>{box.hidden=true;button.setAttribute("aria-expanded","false")};box.querySelector(".reader-btn").onclick=e=>{const pressed=e.currentTarget.getAttribute("aria-pressed")==="true";e.currentTarget.setAttribute("aria-pressed",String(!pressed));box.classList.toggle("reader-mode",!pressed)}}
function addStudentTools(){const sec=document.createElement("section");sec.className="wrap";sec.id="student-tools";sec.innerHTML=`<div class="feature-head"><div><h2>Εργαλεία μαθητή</h2><p class="lead">Μικρές χρήσιμες λειτουργίες για την παρουσίαση και την καθημερινότητα στο σχολείο.</p></div></div><div class="tool-grid"><article class="tool-card"><h3>Οι σημειώσεις μου</h3><p class="note">Αποθηκεύονται μόνο σε αυτή τη συσκευή.</p><textarea id="studentNotes" placeholder="Γράψε μια υπενθύμιση, εργασία ή σημείωση…"></textarea><div class="tool-actions"><button class="ib" id="saveNotes" type="button">Αποθήκευση</button><span id="notesSaved" class="saved" aria-live="polite"></span></div></article><article class="tool-card"><h3>Λειτουργία παρουσίασης</h3><p>Μεγαλώνει την αρχική ενότητα, μειώνει τους περισπασμούς και είναι ιδανική για προβολέα.</p><button class="ib" id="presentMode" type="button">Έναρξη παρουσίασης</button><p class="note" style="margin-top:12px">Συντόμευση: πατήστε <kbd>P</kbd>.</p></article></div>`;document.querySelector("#epikoinonia").before(sec);const ta=sec.querySelector("#studentNotes"),saved=sec.querySelector("#notesSaved");try{ta.value=localStorage.getItem("student-notes")||""}catch{}sec.querySelector("#saveNotes").onclick=()=>{try{localStorage.setItem("student-notes",ta.value);saved.textContent="Αποθηκεύτηκε ✓"}catch{saved.textContent="Δεν ήταν δυνατή η αποθήκευση"}};const toggle=()=>{document.body.classList.toggle("presentation-mode");sec.querySelector("#presentMode").textContent=document.body.classList.contains("presentation-mode")?"Έξοδος από παρουσίαση":"Έναρξη παρουσίασης";window.scrollTo({top:0,behavior:"smooth"})};sec.querySelector("#presentMode").onclick=toggle;addEventListener("keydown",e=>{if(e.key.toLowerCase()==="p"&&!/input|textarea/i.test(e.target.tagName))toggle()})}
function addQuickDigitalLink(){const a=document.createElement("a");a.className="qc";a.href="#digital";a.innerHTML="<b aria-hidden=\"true\">⌁</b><span data-digital-text=\"title\"></span>";document.querySelector(".quick").append(a);const nav=document.querySelector("nav");if(nav){const n=document.createElement("a");n.href="#digital";n.dataset.digitalText="title";nav.append(n)}}
function updateDigitalI18n(){const d=digitalWords();document.querySelectorAll("[data-digital-text]").forEach(el=>{el.textContent=d[el.dataset.digitalText]||d.title});const input=document.querySelector("#digitalSearch");if(input){input.placeholder=d.search;input.setAttribute("aria-label",d.search)}document.querySelector("#digital")?._digitalDraw?.();const themeButton=document.querySelector("#tb");if(themeButton){themeButton.classList.add("ib");themeButton.setAttribute("aria-label",typeof themeMode==="string"?`Theme: ${themeMode}`:"Theme")}}
addQuickDigitalLink();addDigitalClasses();addStudentTools();upgradeNews();const inheritedI18n=window.applyI18n;window.applyI18n=function(){inheritedI18n();updateDigitalI18n()};updateDigitalI18n();
</script>

<script id="v11-enhancements">
(()=>{"use strict";
const $v=s=>document.querySelector(s),$$v=s=>[...document.querySelectorAll(s)],key="v11-settings";
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||"{}")}catch{return{}}};
let settings=Object.assign({font:.1+0.9,leading:1.6,density:"normal",surface:"default",contrast:false,motion:false,focus:false},read());

const toast=message=>{const n=$v("#v11-toast");n.textContent=message;n.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove("show"),2200)};

const originalColours=$v("#cm"),colourHost=$v("#v11-colours");if(originalColours&&colourHost)colourHost.append(originalColours);
const panel=$v("#v11-panel"),open=$v("#v11-open");const panelState=state=>{panel.hidden=!state;open.classList.toggle("is-open",state);open.setAttribute("aria-expanded",String(state));if(state)$v("#v11-font").focus()};

$v("#v11-font").oninput=e=>{settings.font=+e.target.value;save();apply()};$v("#v11-leading").oninput=e=>{settings.leading=+e.target.value;save();apply()};$v("#v11-density").onchange=e=>{settings.density=e.target.value;save();apply()};$v("#v11-surface").onchange=e=>{settings.surface=e.target.value;save();apply()};
const currentSection=()=>$$v("main section.wrap").find(x=>x.classList.contains("v11-current"))||$$v("main section.wrap").find(x=>x.id)||document.querySelector("main");
const setCurrent=()=>{const top=innerHeight*.42;let win=null,min=Infinity;$$v("main section.wrap[id]").forEach(s=>{const d=Math.abs(s.getBoundingClientRect().top-top);if(d<min){min=d;win=s}});$$v("main section.wrap[id]").forEach(s=>s.classList.toggle("v11-current",s===win));return win};

$v("#v11-panel").addEventListener("click",async e=>{const b=e.target.closest("[data-v11]");if(!b)return;const action=b.dataset.v11;
if(action==="contrast"){settings.contrast=!settings.contrast;toast(settings.contrast?"Υψηλή αντίθεση ενεργή":"Υψηλή αντίθεση ανενεργή")}
if(action==="motion"){settings.motion=!settings.motion;toast(settings.motion?"Η κίνηση μειώθηκε":"Πλήρη εφέ ενεργά")}
if(action==="focus"){settings.focus=!settings.focus;toast(settings.focus?"Εστίαση στην τρέχουσα ενότητα":"Λειτουργία εστίασης έκλεισε")}
if(action==="bookmark"){const s=setCurrent();if(s&&s.id){try{localStorage.setItem("v11-place",s.id)}catch{}toast("Αποθηκεύτηκε: "+(s.querySelector("h2")?.textContent||"ενότητα"))}}
if(action==="return"){let id="";try{id=localStorage.getItem("v11-place")||""}catch{};const s=id&&document.getElementById(id);if(s){s.scrollIntoView({behavior:settings.motion?"auto":"smooth",block:"start"});toast("Επιστροφή στην αποθηκευμένη θέση")}else toast("Δεν υπάρχει αποθηκευμένη θέση ακόμη")}
if(action==="share"){const data={title:document.title,text:"7ο ΕΠΑΛ Λάρισας",url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);toast("Ο σύνδεσμος αντιγράφηκε")}}catch{}}
if(action==="palette")showPalette(true);
if(action==="reset"){settings={font:1,leading:1.6,density:"normal",surface:"default",contrast:false,motion:false,focus:false};save();apply();toast("Οι ρυθμίσεις επανήλθαν")}
save();apply()});
const palette=$v("#v11-palette"),search=$v("#v11-search"),results=$v("#v11-results");
const commands=()=>$$v("main section.wrap[id]").map(s=>({label:s.querySelector("h2")?.textContent?.trim()||s.id,target:s.id})).filter(x=>x.label).concat([{label:"Άνοιγμα βοηθού AI",action:()=>typeof aiOpen==="function"&&aiOpen(true)},{label:"Αλλαγή εμφάνισης",action:()=>panelState(true)},{label:"Πίσω στην αρχή",action:()=>scrollTo({top:0,behavior:settings.motion?"auto":"smooth"})}]);
const drawCommands=()=>{const term=search.value.trim().toLocaleLowerCase("el");const found=commands().filter(x=>x.label.toLocaleLowerCase("el").includes(term)).slice(0,8);results.innerHTML=found.map((x,i)=>'<button class="v11-command" data-v11-c="'+i+'" type="button">'+x.label+"</button>").join("")||'<p class="v11-hint">Δεν βρέθηκε ενότητα.</p>';results._items=found};

search.oninput=drawCommands;results.onclick=e=>{const b=e.target.closest("[data-v11-c]"),item=b&&results._items[+b.dataset.v11C];if(!item)return;showPalette(false);if(item.target)document.getElementById(item.target)?.scrollIntoView({behavior:settings.motion?"auto":"smooth",block:"start"});else item.action?.()};

/* AI companion: 1 quick prompts, 2 voice input, 3 speech, 4 copy, 5 pins,

const aiPanel=$v("#aip"),aiInput=$v("#aii"),aiMessages=$v("#aim"),tutorMessages=$v("#tum2");
if(!aiPanel||!aiInput)return;
const kit=document.createElement("div");kit.id="v11-ai";kit.innerHTML='<div class="v11-ai-top"><span>✨ AI εργαλειοθήκη</span><button type="button" class="v11-k" data-k="save">💾 Συνεδρία</button></div><div class="v11-ai-actions"><button type="button" class="v11-k" data-k="bell">Πρόγραμμα σήμερα</button><button type="button" class="v11-k" data-k="plan">Οργάνωσε εργασία</button><button type="button" class="v11-k" data-k="explain">Εξήγησέ το απλά</button><button type="button" class="v11-k" data-k="voice">🎙 Φωνή</button><button type="button" class="v11-k" data-k="clear">Καθαρισμός</button><button type="button" class="v11-k" data-k="export">⇩ Εξαγωγή</button></div><div id="v11-saved" hidden></div>';
($v("#aitabs")||aiPanel.firstElementChild).after(kit);
const savedKey="v11-ai-pins";const pins=()=>{try{return JSON.parse(localStorage.getItem(savedKey)||"[]")}catch{return[]}};const renderPins=()=>{const box=$v("#v11-saved"),data=pins();box.hidden=!data.length;box.innerHTML=data.slice(-4).reverse().map((x,i)=>'<div class="v11-saved-item">'+x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'<button data-unpin="'+i+'" type="button">×</button></div>').join("")};renderPins();
const copyText=async text=>{try{await navigator.clipboard.writeText(text);toast("Αντιγράφηκε") }catch{toast("Η αντιγραφή δεν είναι διαθέσιμη")}};
const speak=text=>{if(!("speechSynthesis" in window)){toast("Η εκφώνηση δεν υποστηρίζεται εδώ");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=(document.documentElement.lang||"el")+"-GR";u.rate=.95;speechSynthesis.speak(u);toast("Γίνεται εκφώνηση")};
const enhanceReply=node=>{if(!node||node.dataset.v11Reply||!node.classList.contains("a"))return;node.dataset.v11Reply="1";const text=()=>node.childNodes[0]?.textContent?.trim()||node.textContent.trim();const row=document.createElement("div");row.className="v11-reply-actions";row.innerHTML='<button type="button" data-ra="copy">⧉</button><button type="button" data-ra="speak">🔊</button><button type="button" data-ra="pin">☆</button>';const meta=document.createElement("small");meta.className="v11-reply-meta";meta.textContent=Math.max(0,text().split(/\s+/).filter(Boolean).length)+" λέξεις · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});row.onclick=e=>{const a=e.target.closest("[data-ra]")?.dataset.ra;if(a==="copy")copyText(text());if(a==="speak")speak(text());if(a==="pin"){const p=pins();p.push(text());try{localStorage.setItem(savedKey,JSON.stringify(p.slice(-20)))}catch{}renderPins();toast("Η απάντηση αποθηκεύτηκε")}};node.append(row,meta)};
const watch=new MutationObserver(list=>list.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1)enhanceReply(n)})));[aiMessages,tutorMessages].filter(Boolean).forEach(box=>{box.querySelectorAll(".m.a").forEach(enhanceReply);watch.observe(box,{childList:true})});
const submitPrompt=text=>{aiInput.value=text;aiInput.focus();const form=$v("#aif");if(form?.requestSubmit)form.requestSubmit();else form?.dispatchEvent(new Event("submit",{cancelable:true}))};
kit.onclick=e=>{const a=e.target.closest("[data-k]")?.dataset.k;if(!a)return;const prompts={bell:"Ποιο είναι το πρόγραμμά μου σήμερα και ποιο μάθημα ακολουθεί;",plan:"Βοήθησέ με να σπάσω αυτή την εργασία σε μικρά βήματα με χρονικό πλάνο:",explain:"Εξήγησέ μου απλά, με ένα σύντομο παράδειγμα:"};if(prompts[a])submitPrompt(prompts[a]);if(a==="clear"){[aiMessages,tutorMessages].filter(Boolean).forEach(x=>x.innerHTML="");toast("Η συνομιλία καθαρίστηκε")}if(a==="save"){const data=[...document.querySelectorAll("#aim .m,#tum2 .m")].map(x=>x.textContent.trim()).filter(Boolean);try{localStorage.setItem("v11-ai-session",JSON.stringify(data.slice(-30)));toast("Αποθηκεύτηκαν "+data.length+" μηνύματα")}catch{}}if(a==="export"){const data=[...document.querySelectorAll("#aim .m,#tum2 .m")].map(x=>x.textContent.trim()).filter(Boolean).join("\n\n");const url=URL.createObjectURL(new Blob([data||"Δεν υπάρχει συνομιλία.",],{type:"text/plain;charset=utf-8"})),link=document.createElement("a");link.href=url;link.download="7epal-ai-session.txt";link.click();setTimeout(()=>URL.revokeObjectURL(url),500)}if(a==="voice"){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){toast("Η φωνητική πληκτρολόγηση δεν υποστηρίζεται από αυτόν τον browser");return}const r=new Recognition();r.lang=document.documentElement.lang==="el"?"el-GR":document.documentElement.lang||"en-US";r.interimResults=true;r.onstart=()=>toast("Ακούω…");r.onresult=x=>{aiInput.value=[...x.results].map(y=>y[0].transcript).join("");if(x.results[x.results.length-1].isFinal)aiInput.focus()};r.onerror=()=>toast("Δεν ακούστηκε καθαρά η φωνή");r.start()}};
$v("#v11-saved").onclick=e=>{const b=e.target.closest("[data-unpin]");if(!b)return;const p=pins();p.splice(p.length-1-(+b.dataset.unpin),1);try{localStorage.setItem(savedKey,JSON.stringify(p))}catch{}renderPins()};
})();
